<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light only">
    <title>Heyora | Coming Soon</title>
    <meta name="description" content="Heyora - Crafting something meaningful. Coming Soon.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* Force light mode - prevent dark mode override */
        :root {
            color-scheme: light only;
            /* Light pastel palette */
            --color-bg: #f5f0eb;
            --color-bg-warm: #ebe4dc;
            --color-text: #2a2522;
            --color-text-muted: #7a7270;
            --color-accent: #b8977a;
            --color-accent-dark: #96775c;
            --color-decoration: rgba(184, 151, 122, 0.45);
            --color-decoration-strong: rgba(184, 151, 122, 0.65);
            --color-decoration-soft: rgba(184, 151, 122, 0.25);
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Outfit', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            background-color: #f5f0eb !important;
        }

        body {
            font-family: var(--font-body);
            background-color: #f5f0eb !important;
            color: #2a2522 !important;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            position: relative;
            -webkit-text-fill-color: initial;
        }

        /* Subtle noise texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
        }

        /* ========== DECORATIVE ELEMENTS - MORE VISIBLE ========== */
        .decoration {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }

        /* Large rotating circle - top right */
        .decoration-circle {
            width: min(550px, 65vw);
            height: min(550px, 65vw);
            border: 1.5px solid var(--color-decoration-strong);
            border-radius: 50%;
            top: -12%;
            right: -12%;
            animation: rotate 80s linear infinite;
        }

        .decoration-circle::before {
            content: '';
            position: absolute;
            width: 70%;
            height: 70%;
            border: 1.5px solid var(--color-decoration);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .decoration-circle::after {
            content: '';
            position: absolute;
            width: 40%;
            height: 40%;
            border: 1px solid var(--color-decoration-soft);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Second rotating circle - bottom left */
        .decoration-circle-2 {
            width: min(400px, 50vw);
            height: min(400px, 50vw);
            border: 1px solid var(--color-decoration);
            border-radius: 50%;
            bottom: -15%;
            left: -15%;
            animation: rotate 100s linear infinite reverse;
        }

        .decoration-circle-2::before {
            content: '';
            position: absolute;
            width: 60%;
            height: 60%;
            border: 1px solid var(--color-decoration-soft);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Vertical accent lines */
        .decoration-line-left {
            width: 1px;
            height: 45vh;
            background: linear-gradient(to bottom, transparent, var(--color-decoration-strong), transparent);
            left: 8%;
            top: 28%;
        }

        .decoration-line-right {
            width: 1px;
            height: 40vh;
            background: linear-gradient(to bottom, transparent, var(--color-decoration-strong), transparent);
            right: 10%;
            bottom: 22%;
        }

        /* Horizontal accent line */
        .decoration-line-horizontal {
            width: 20vw;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--color-decoration), transparent);
            top: 20%;
            left: 5%;
        }

        /* Dot grid patterns - more visible */
        .decoration-dots {
            width: clamp(80px, 12vw, 140px);
            height: clamp(80px, 12vw, 140px);
            bottom: 12%;
            left: 4%;
            background-image: radial-gradient(circle, var(--color-decoration-strong) 2px, transparent 2px);
            background-size: 16px 16px;
            animation: pulse 4s ease-in-out infinite;
        }

        .decoration-dots-right {
            width: clamp(60px, 10vw, 100px);
            height: clamp(60px, 10vw, 100px);
            top: 15%;
            right: 5%;
            background-image: radial-gradient(circle, var(--color-decoration) 1.5px, transparent 1.5px);
            background-size: 14px 14px;
            animation: pulse 5s ease-in-out infinite reverse;
        }

        /* Additional dot cluster - center left */
        .decoration-dots-mid {
            width: clamp(50px, 8vw, 80px);
            height: clamp(50px, 8vw, 80px);
            top: 55%;
            left: 3%;
            background-image: radial-gradient(circle, var(--color-decoration) 1.5px, transparent 1.5px);
            background-size: 12px 12px;
            animation: pulse 6s ease-in-out infinite;
        }

        /* Elegant arch at bottom */
        .decoration-arch {
            width: clamp(250px, 40vw, 450px);
            height: clamp(125px, 20vw, 225px);
            border: 1.5px solid var(--color-decoration);
            border-bottom: none;
            border-radius: 50% 50% 0 0;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Floating shapes - more visible */
        .shape {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }

        .shape-diamond {
            width: clamp(50px, 6vw, 70px);
            height: clamp(50px, 6vw, 70px);
            border: 1.5px solid var(--color-decoration-strong);
            top: 22%;
            left: 5%;
            transform: rotate(45deg);
            animation: float 8s ease-in-out infinite;
        }

        .shape-diamond-2 {
            width: clamp(30px, 4vw, 45px);
            height: clamp(30px, 4vw, 45px);
            border: 1px solid var(--color-decoration);
            bottom: 28%;
            right: 8%;
            transform: rotate(45deg);
            animation: float 7s ease-in-out infinite 1s;
        }

        .shape-circle {
            width: clamp(30px, 4vw, 45px);
            height: clamp(30px, 4vw, 45px);
            background: rgba(184, 151, 122, 0.2);
            border-radius: 50%;
            top: 48%;
            right: 6%;
            animation: float 6s ease-in-out infinite reverse;
        }

        .shape-circle-2 {
            width: clamp(20px, 3vw, 30px);
            height: clamp(20px, 3vw, 30px);
            background: rgba(184, 151, 122, 0.15);
            border-radius: 50%;
            top: 70%;
            left: 8%;
            animation: float 9s ease-in-out infinite;
        }

        .shape-line-diagonal {
            width: clamp(100px, 15vw, 180px);
            height: 1px;
            background: linear-gradient(to right, transparent, var(--color-decoration-strong), transparent);
            top: 35%;
            right: 3%;
            transform: rotate(-25deg);
        }

        .shape-line-diagonal-2 {
            width: clamp(80px, 12vw, 140px);
            height: 1px;
            background: linear-gradient(to right, transparent, var(--color-decoration), transparent);
            bottom: 35%;
            left: 2%;
            transform: rotate(20deg);
        }

        /* Small accent crosses */
        .shape-cross {
            width: 24px;
            height: 24px;
            bottom: 30%;
            right: 14%;
            position: fixed;
        }

        .shape-cross::before,
        .shape-cross::after {
            content: '';
            position: absolute;
            background: var(--color-decoration-strong);
        }

        .shape-cross::before {
            width: 100%;
            height: 1.5px;
            top: 50%;
            left: 0;
        }

        .shape-cross::after {
            width: 1.5px;
            height: 100%;
            left: 50%;
            top: 0;
        }

        .shape-cross-2 {
            width: 18px;
            height: 18px;
            top: 38%;
            left: 12%;
            position: fixed;
        }

        .shape-cross-2::before,
        .shape-cross-2::after {
            content: '';
            position: absolute;
            background: var(--color-decoration);
        }

        .shape-cross-2::before {
            width: 100%;
            height: 1px;
            top: 50%;
            left: 0;
        }

        .shape-cross-2::after {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
        }

        /* Organic leaf-inspired curves - hint at sustainability */
        .shape-leaf {
            width: clamp(60px, 8vw, 100px);
            height: clamp(90px, 12vw, 150px);
            border: 1px solid var(--color-decoration);
            border-radius: 0 100% 0 100%;
            top: 60%;
            right: 4%;
            transform: rotate(-30deg);
            animation: sway 10s ease-in-out infinite;
        }

        .shape-leaf-2 {
            width: clamp(40px, 6vw, 70px);
            height: clamp(60px, 9vw, 100px);
            border: 1px solid var(--color-decoration-soft);
            border-radius: 100% 0 100% 0;
            top: 25%;
            left: 10%;
            transform: rotate(15deg);
            animation: sway 12s ease-in-out infinite reverse;
        }

        /* Soft wave line - comfort/flow */
        .shape-wave {
            position: fixed;
            bottom: 18%;
            left: 15%;
            width: clamp(100px, 18vw, 200px);
            height: 40px;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(45deg); }
            50% { transform: translateY(-15px) rotate(45deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-30deg) translateX(0); }
            50% { transform: rotate(-25deg) translateX(5px); }
        }

        /* Abstract silhouette illustrations - more visible */
        .illustration {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            color: #b8977a;
            opacity: 0.22;
        }

        .illustration-left {
            left: 0%;
            top: 50%;
            transform: translateY(-50%);
            width: clamp(120px, 18vw, 200px);
            height: auto;
            aspect-ratio: 150 / 350;
        }

        .illustration-right {
            right: 0%;
            top: 50%;
            transform: translateY(-50%);
            width: clamp(120px, 18vw, 200px);
            height: auto;
            aspect-ratio: 150 / 350;
        }

        /* ========== MAIN LAYOUT ========== */
        .page-wrapper {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            padding: clamp(1rem, 3vw, 2rem) clamp(1.5rem, 5vw, 3rem);
            padding-top: max(clamp(1rem, 3vw, 2rem), env(safe-area-inset-top));
            padding-left: max(clamp(1.5rem, 5vw, 3rem), env(safe-area-inset-left));
            padding-right: max(clamp(1.5rem, 5vw, 3rem), env(safe-area-inset-right));
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header-left {
            font-family: var(--font-display);
            font-size: clamp(0.7rem, 1.5vw, 0.85rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #7a7270 !important;
            -webkit-text-fill-color: #7a7270 !important;
        }

        .header-right {
            font-family: var(--font-display);
            font-style: italic;
            font-size: clamp(0.75rem, 1.5vw, 0.9rem);
            color: #96775c !important;
            -webkit-text-fill-color: #96775c !important;
            letter-spacing: 0.05em;
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: clamp(1rem, 4vw, 2rem);
            width: 100%;
            max-width: 100%;
        }

        .content-wrapper {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ========== LOGO - SINGLE LINE ========== */
        .logo-section {
            margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .brand-name {
            font-family: var(--font-display);
            font-size: clamp(4rem, 16vw, 9rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1;
            color: #2a2522 !important;
            -webkit-text-fill-color: #2a2522 !important;
            white-space: nowrap;
        }

        .brand-name .accent {
            font-style: italic;
            color: #b8977a !important;
            -webkit-text-fill-color: #b8977a !important;
        }

        /* Divider */
        .divider {
            width: 50px;
            height: 1px;
            background: #b8977a;
            margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
            animation: expandWidth 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            transform: scaleX(0);
        }

        @keyframes expandWidth {
            to { transform: scaleX(1); }
        }

        @keyframes revealUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Two-line Tagline */
        .tagline {
            font-family: var(--font-display);
            font-size: clamp(1.1rem, 2.8vw, 1.5rem);
            font-weight: 300;
            font-style: italic;
            line-height: 1.7;
            color: #7a7270 !important;
            -webkit-text-fill-color: #7a7270 !important;
            margin-bottom: clamp(2rem, 5vw, 3rem);
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
            opacity: 0;
            max-width: 500px;
        }

        /* ========== FORM SECTION ========== */
        .form-section {
            width: 100%;
            max-width: 440px;
            padding: 0 1rem;
            animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            opacity: 0;
        }

        .form-label {
            font-family: var(--font-body);
            font-size: clamp(0.68rem, 1.2vw, 0.72rem);
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #7a7270 !important;
            -webkit-text-fill-color: #7a7270 !important;
            margin-bottom: clamp(0.75rem, 2vw, 1rem);
            display: block;
        }

        .email-form {
            display: flex;
            flex-direction: row;
            border: 1px solid rgba(184, 151, 122, 0.65);
            border-radius: 2px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.5) !important;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .email-form:focus-within {
            border-color: #b8977a;
            box-shadow: 0 0 25px rgba(184, 151, 122, 0.15);
        }

        .email-input {
            flex: 1;
            min-width: 0;
            padding: clamp(0.9rem, 2vw, 1.1rem) clamp(1rem, 2vw, 1.3rem);
            font-family: var(--font-body);
            font-size: clamp(0.85rem, 1.8vw, 0.95rem);
            font-weight: 300;
            letter-spacing: 0.02em;
            background: transparent !important;
            border: none;
            color: #2a2522 !important;
            -webkit-text-fill-color: #2a2522 !important;
            outline: none;
        }

        .email-input::placeholder {
            color: #7a7270 !important;
            -webkit-text-fill-color: #7a7270 !important;
            opacity: 1;
        }

        .submit-btn {
            padding: clamp(0.9rem, 2vw, 1.1rem) clamp(1.2rem, 3vw, 1.8rem);
            font-family: var(--font-body);
            font-size: clamp(0.6rem, 1.2vw, 0.68rem);
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: #b8977a !important;
            color: white !important;
            -webkit-text-fill-color: white !important;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .submit-btn:hover {
            background: #96775c !important;
        }

        .form-note {
            font-family: var(--font-body);
            font-size: clamp(0.72rem, 1.3vw, 0.78rem);
            font-weight: 300;
            color: #7a7270 !important;
            -webkit-text-fill-color: #7a7270 !important;
            margin-top: clamp(0.6rem, 1.5vw, 0.9rem);
            letter-spacing: 0.02em;
        }

        /* Success message */
        .success-message {
            display: none;
            padding: 1.5rem 0;
        }

        .success-message.show {
            display: block;
            animation: revealUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .success-message p {
            font-family: var(--font-display);
            font-size: clamp(1rem, 2vw, 1.15rem);
            font-style: italic;
            color: #96775c !important;
            -webkit-text-fill-color: #96775c !important;
        }

        /* ========== FOOTER ========== */
        .footer {
            padding: clamp(1rem, 3vw, 2rem) clamp(1.5rem, 5vw, 3rem);
            padding-bottom: max(clamp(1rem, 3vw, 2rem), env(safe-area-inset-bottom));
            padding-left: max(clamp(1.5rem, 5vw, 3rem), env(safe-area-inset-left));
            padding-right: max(clamp(1.5rem, 5vw, 3rem), env(safe-area-inset-right));
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem 2rem;
            flex-shrink: 0;
        }

        .footer-text {
            font-family: var(--font-body);
            font-size: clamp(0.66rem, 1.2vw, 0.7rem);
            font-weight: 300;
            letter-spacing: 0.12em;
            color: #7a7270 !important;
            -webkit-text-fill-color: #7a7270 !important;
            text-transform: uppercase;
            line-height: 1.9;
        }

        .contact {
            font-style: normal;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.25rem 0.9rem;
            padding: 0 clamp(1.5rem, 5vw, 3rem);
            font-family: var(--font-body);
            font-size: clamp(0.72rem, 1.3vw, 0.8rem);
            font-weight: 300;
            letter-spacing: 0.06em;
            color: #7a7270 !important;
            -webkit-text-fill-color: #7a7270 !important;
        }

        .contact-item {
            color: inherit !important;
            -webkit-text-fill-color: #7a7270 !important;
            text-decoration: none;
            padding: 0.35rem 0;
        }

        a.contact-item:hover,
        a.contact-item:focus-visible {
            -webkit-text-fill-color: #96775c !important;
        }

        .contact-sep {
            color: #b8977a;
            -webkit-text-fill-color: #b8977a !important;
        }

        .footer-credit {
            white-space: nowrap;
        }

        .nowrap {
            white-space: nowrap;
        }

        .heart {
            width: 1.15em;
            height: 1.15em;
            vertical-align: -0.2em;
            fill: #f6c35a;
        }

        .footer-link {
            color: #96775c !important;
            -webkit-text-fill-color: #96775c !important;
            text-decoration: none;
            border-bottom: 1px solid rgba(184, 151, 122, 0.5);
            transition: border-color 0.3s ease;
        }

        .footer-link:hover,
        .footer-link:focus-visible {
            border-color: #96775c;
        }

        .social-links {
            display: flex;
            gap: clamp(1rem, 3vw, 2rem);
        }

        .social-link {
            font-family: var(--font-body);
            font-size: clamp(0.66rem, 1.2vw, 0.7rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            color: #7a7270 !important;
            -webkit-text-fill-color: #7a7270 !important;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.3s ease;
            position: relative;
            display: inline-block;
            padding: 0.5rem 0;
        }

        .social-link::after {
            content: '';
            position: absolute;
            bottom: 0.3rem;
            left: 0;
            width: 0;
            height: 1px;
            background: #b8977a;
            transition: width 0.3s ease;
        }

        .social-link:hover {
            color: #96775c !important;
            -webkit-text-fill-color: #96775c !important;
        }

        .social-link:hover::after {
            width: 100%;
        }

        /* ========== RESPONSIVE - TABLET ========== */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 0.4rem;
                text-align: center;
            }

            .footer {
                flex-direction: column;
                gap: 0.4rem;
                text-align: center;
            }

            .illustration {
                display: none;
            }

            .decoration-line-left,
            .decoration-line-right {
                opacity: 0.6;
            }

            .illustration {
                opacity: 0.12;
            }

            .shape-leaf,
            .shape-leaf-2 {
                opacity: 0.6;
            }
        }

        /* ========== RESPONSIVE - MOBILE ========== */
        @media (max-width: 480px) {
            .email-form {
                flex-direction: column;
            }

            .email-input {
                text-align: center;
                font-size: 16px; /* stops iOS zooming in on focus */
            }

            .footer-text {
                letter-spacing: 0.08em;
            }

            .footer-credit {
                display: block;
                white-space: normal;
            }

            .decoration-dots {
                display: none;
            }

            .contact {
                flex-direction: column;
                gap: 0;
            }

            .contact-sep {
                display: none;
            }

            .submit-btn {
                padding: 1rem;
            }

            .decoration-circle {
                width: 280px;
                height: 280px;
                top: -100px;
                right: -100px;
            }

            .decoration-circle-2 {
                width: 200px;
                height: 200px;
                bottom: -80px;
                left: -80px;
            }

            .decoration-line-left,
            .decoration-line-right,
            .decoration-line-horizontal,
            .shape-line-diagonal,
            .shape-line-diagonal-2,
            .shape-cross,
            .shape-cross-2,
            .shape-wave {
                display: none;
            }

            .illustration {
                display: none;
            }

            .shape-diamond,
            .shape-diamond-2,
            .shape-circle,
            .shape-circle-2 {
                opacity: 0.6;
            }

            .shape-leaf,
            .shape-leaf-2 {
                opacity: 0.4;
            }

            .decoration-dots,
            .decoration-dots-right,
            .decoration-dots-mid {
                opacity: 0.5;
            }

            .decoration-dots-mid,
            .shape-circle {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ========== LANDSCAPE MOBILE FIX ========== */
        @media (max-height: 500px) and (orientation: landscape) {
            .main-content {
                padding: 1rem;
            }

            .logo-section {
                margin-bottom: 1rem;
            }

            .brand-name {
                font-size: clamp(2.5rem, 10vw, 4rem);
            }

            .divider {
                margin-bottom: 1rem;
            }

            .tagline {
                margin-bottom: 1rem;
                font-size: 0.95rem;
            }

            .header,
            .footer {
                padding-top: 0.75rem;
                padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
            }
        }

        /* ========== FORCE LIGHT MODE - PREVENT DARK MODE ========== */
        @media (prefers-color-scheme: dark) {
            html, body {
                background-color: #f5f0eb !important;
                color: #2a2522 !important;
            }
            
            .brand-name {
                color: #2a2522 !important;
                -webkit-text-fill-color: #2a2522 !important;
            }
            
            .brand-name .accent {
                color: #b8977a !important;
                -webkit-text-fill-color: #b8977a !important;
            }
        }
    </style>
</head>
<body>
    <!-- Decorative elements -->
    <div class="decoration decoration-circle"></div>
    <div class="decoration decoration-circle-2"></div>
    <div class="decoration decoration-line-left"></div>
    <div class="decoration decoration-line-right"></div>
    <div class="decoration decoration-line-horizontal"></div>
    <div class="decoration decoration-dots"></div>
    <div class="decoration decoration-dots-right"></div>
    <div class="decoration decoration-dots-mid"></div>
    <div class="decoration decoration-arch"></div>
    
    <div class="shape shape-diamond"></div>
    <div class="shape shape-diamond-2"></div>
    <div class="shape shape-circle"></div>
    <div class="shape shape-circle-2"></div>
    <div class="shape shape-line-diagonal"></div>
    <div class="shape shape-line-diagonal-2"></div>
    <div class="shape-cross"></div>
    <div class="shape-cross-2"></div>
    
    <!-- Organic shapes - sustainability hint -->
    <div class="shape shape-leaf"></div>
    <div class="shape shape-leaf-2"></div>
    
    <!-- Wave shape -->
    <svg class="shape-wave" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0 20 Q50 0 100 20 T200 20" stroke="rgba(184, 151, 122, 0.4)" stroke-width="1" fill="none"/>
    </svg>

    <!-- Abstract fashion silhouettes -->
    <div class="illustration illustration-left">
        <svg viewBox="0 0 150 350" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <path d="M75 25 Q90 50 75 80 Q60 110 75 140 Q90 170 75 200 Q60 230 75 260 Q90 290 75 320" stroke="currentColor" stroke-width="1" fill="none"/>
            <circle cx="75" cy="40" r="22" stroke="currentColor" stroke-width="1" fill="none"/>
            <path d="M53 85 Q35 120 45 160" stroke="currentColor" stroke-width="1" fill="none"/>
            <path d="M97 85 Q115 120 105 160" stroke="currentColor" stroke-width="1" fill="none"/>
            <ellipse cx="75" cy="120" rx="30" ry="15" stroke="currentColor" stroke-width="0.5" fill="none"/>
            <path d="M55 200 Q75 280 55 340" stroke="currentColor" stroke-width="1" fill="none"/>
            <path d="M95 200 Q75 280 95 340" stroke="currentColor" stroke-width="1" fill="none"/>
        </svg>
    </div>
    
    <div class="illustration illustration-right">
        <svg viewBox="0 0 150 350" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <line x1="75" y1="30" x2="75" y2="320" stroke="currentColor" stroke-width="0.5"/>
            <circle cx="75" cy="45" r="20" stroke="currentColor" stroke-width="1" fill="none"/>
            <path d="M55 75 Q40 110 50 150 Q60 190 50 230" stroke="currentColor" stroke-width="1" fill="none"/>
            <path d="M95 75 Q110 110 100 150 Q90 190 100 230" stroke="currentColor" stroke-width="1" fill="none"/>
            <path d="M60 230 Q75 300 55 350" stroke="currentColor" stroke-width="1" fill="none"/>
            <path d="M90 230 Q75 300 95 350" stroke="currentColor" stroke-width="1" fill="none"/>
            <ellipse cx="75" cy="130" rx="25" ry="40" stroke="currentColor" stroke-width="0.5" fill="none"/>
        </svg>
    </div>

    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="header-left">Est. 2026</div>
            <div class="header-right">Coming Soon</div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <!-- Logo - Single line Heyora -->
                <div class="logo-section">
                    <h1 class="brand-name">H<span class="accent">e</span>yora</h1>
                </div>

                <div class="divider"></div>

                <p class="tagline">Crafting something meaningful,<br>every thread tells a story worth wearing.</p>

                <div class="form-section">
                    <label class="form-label">Be the first to know</label>
                    <form class="email-form" id="signup-form">
                        <input 
                            type="email" 
                            class="email-input" 
                            placeholder="Enter your email address"
                            required
                            aria-label="Email address"
                        >
                        <button type="submit" class="submit-btn">Join Us</button>
                    </form>
                    <p class="form-note">No spam, just the unveiling.</p>
                    
                    <div class="success-message" id="success-message">
                        <p>Welcome. We'll be in touch.</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Contact -->
        <address class="contact">
            <a class="contact-item" href="mailto:hey@heyora.co">hey@heyora.co</a>
            <span class="contact-sep" aria-hidden="true">·</span>
            <a class="contact-item" href="tel:+13616615552">+1 (361) 661-5552</a>
        </address>

        <!-- Footer -->
        <footer class="footer">
            <p class="footer-text">
                © <span class="year">2026</span> heyora.co.
                <span class="footer-credit">Crafted with <svg class="heart" viewBox="0 0 24 24" role="img" aria-label="love"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.9 4.5 6.6 4.5c2.2 0 3.7 1.2 4.6 2.6.9-1.4 2.4-2.6 4.6-2.6 3.7 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21Z"/></svg> by <span class="nowrap">© <span class="year">2026</span> <a class="footer-link" href="https://www.vprovesolutions.com" target="_blank" rel="noopener noreferrer">VProve Solutions Private Limited</a>.</span></span>
            </p>
            <div class="social-links">
                <a href="#" class="social-link">Instagram</a>
                <a href="#" class="social-link">Pinterest</a>
            </div>
        </footer>
    </div>

    <script type="module">
        document.querySelectorAll('.year').forEach((el) => (el.textContent = new Date().getFullYear()));

        // Form submission. Sign-ups are posted to VITE_WAITLIST_ENDPOINT (set in Vercel) when it is configured.
        const endpoint = import.meta.env.VITE_WAITLIST_ENDPOINT;
        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = this;
            const successMessage = document.getElementById('success-message');
            const button = form.querySelector('.submit-btn');
            const note = document.querySelector('.form-note');
            
            button.disabled = true;
            try {
                if (endpoint) {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                        body: JSON.stringify({ email: form.querySelector('.email-input').value.trim(), source: 'heyora.co' }),
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                }
                form.style.display = 'none';
                note.style.display = 'none';
                successMessage.classList.add('show');
            } catch {
                note.textContent = 'Something went wrong. Please try again in a moment.';
            } finally {
                button.disabled = false;
            }
        });

        // Subtle parallax on mouse move (desktop only)
        if (window.matchMedia('(min-width: 769px)').matches) {
            document.addEventListener('mousemove', function(e) {
                const shapes = document.querySelectorAll('.shape-diamond, .shape-diamond-2, .shape-circle, .shape-circle-2');
                const mouseX = e.clientX / window.innerWidth - 0.5;
                const mouseY = e.clientY / window.innerHeight - 0.5;
                
                shapes.forEach((shape, index) => {
                    const speed = (index + 1) * 10;
                    const x = mouseX * speed;
                    const y = mouseY * speed;
                    const baseRotation = shape.classList.contains('shape-diamond') || shape.classList.contains('shape-diamond-2') ? 'rotate(45deg)' : '';
                    shape.style.transform = `translate(${x}px, ${y}px) ${baseRotation}`;
                });

                // Subtle movement for illustrations
                const illustrations = document.querySelectorAll('.illustration');
                illustrations.forEach((ill) => {
                    const x = mouseX * 8;
                    const y = mouseY * 8;
                    ill.style.transform = `translateY(calc(-50% + ${y}px)) translateX(${x}px)`;
                });

                // Gentle movement for leaf shapes
                const leaves = document.querySelectorAll('.shape-leaf, .shape-leaf-2');
                leaves.forEach((leaf, index) => {
                    const speed = 5 + index * 3;
                    const x = mouseX * speed;
                    const y = mouseY * speed;
                    const baseRotation = leaf.classList.contains('shape-leaf') ? '-30deg' : '15deg';
                    leaf.style.transform = `translate(${x}px, ${y}px) rotate(${baseRotation})`;
                });
            });
        }
    </script>
</body>
</html>
